spring.application.name=hive-ingest-service

# Perfil activo por defecto (forzamos local para que el dev cree su application-local.properties)
spring.profiles.active=${APP_PROFILE:local}

# Puerto del servicio. El hive-gateway (9090) enruta hacia este puerto
# bajo el prefijo /ingest (ej: http://<gateway>:9090/ingest/api/v1/hives).
server.port=${SERVER_PORT:9091}

# Configuracion global de Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method