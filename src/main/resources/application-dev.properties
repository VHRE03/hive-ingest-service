# Base de datos (Los valores se inyectan en el servidor de Dev via OS Env Vars)
spring.datasource.url=jdbc:postgresql://${DB_HOST:dev-db-server}:${DB_PORT:5432}/${DB_NAME:hive_dev}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (Seguro para Dev)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# OpenAPI Server
openapi.server.url=https://api-dev.hiveguard.com
openapi.server.description=Servidor de Desarrollo