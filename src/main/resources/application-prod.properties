# Base de datos estricta
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (Optimizacion y Seguridad)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP Pool (Dimensionado para Prod)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# OpenAPI Server (Deshabilitar Swagger en Prod es buena practica, o protegerlo)
springdoc.swagger-ui.enabled=false
# URL base via gateway (prefijo /ingest), igual que en los demas entornos
openapi.server.url=https://api.hiveguard.com/ingest
openapi.server.description=Gateway de Produccion